<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Hors ligne · PROCOM Tools</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #fff; color: #121212; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        main { max-width: 360px; text-align: center; }
        .mark { display: grid; place-items: center; width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 20px; background: #121212; color: #fff; font-size: 2rem; font-weight: 700; }
        h1 { margin: 0 0 8px; font-size: 1.6rem; letter-spacing: -.03em; }
        p { margin: 0 0 20px; color: #6a6a6a; }
        button { padding: 12px 28px; border: 0; border-radius: 999px; background: #a99bf9; color: #121212; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">P</div>
        <h1>Vous êtes hors ligne</h1>
        <p>Cette page n'a pas encore été ouverte sur cet appareil. Reconnectez-vous à Internet, ou retournez sur une page déjà consultée : elle reste disponible en lecture.</p>
        <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
    <script>
        // Revenu en ligne : on recharge tout seul la page demandée.
        addEventListener('online', () => location.reload());
    </script>
</body>
</html>

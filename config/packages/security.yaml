security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Admin et direction peuvent aussi utiliser les outils des agents.
    role_hierarchy:
        ROLE_ADMIN: [ROLE_AGENT]
        ROLE_DIRECTION: [ROLE_AGENT]

    providers:
        app_users:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_users
            custom_authenticators:
                - App\Security\LoginAuthenticator
            # Protège aussi les codes à 6 chiffres contre la force brute.
            login_throttling:
                max_attempts: 5
                interval: '5 minutes'
            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: [ROLE_ADMIN, ROLE_DIRECTION] }
        - { path: ^/, roles: ROLE_AGENT }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10

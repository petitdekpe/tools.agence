security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_users:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_users
            custom_authenticators:
                - App\Security\LoginAuthenticator
            # Protège aussi les codes à 6 chiffres contre la force brute.
            login_throttling:
                max_attempts: 5
                interval: '5 minutes'
            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        # Les droits fins sont des permissions de rôle (voir App\Security\Permission), vérifiées par chaque contrôleur.
        - { path: ^/admin, allow_if: "is_granted('admin.access')" }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
